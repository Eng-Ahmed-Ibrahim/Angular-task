<div class="container py-4">

    <!-- Search -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="search-box">

                <input type="text" class="form-control search-input" placeholder="Search by title or category..."
                    [(ngModel)]="searchTerm">
            </div>
        </div>
    </div>

    <!-- Products -->
    <div class="row g-4">

        @for(product of products$() | search:searchTerm; track product.id) {

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <div class="card product-card h-100">

                <div [routerLink]="['/products', product.id]">

                    <div class="image-wrapper">
                        <img [src]="product.thumbnail" class="card-img-top product-image" [alt]="product.title">
                    </div>

                    <div class="card-body d-flex flex-column">

                        <span class="category-badge">
                            {{ product.category }}
                        </span>

                        <h5 class="card-title mt-2">
                            {{ product.title | transform:3 }}
                        </h5>

                        <p class="card-text text-muted">
                            {{ product.description | limitText }}
                        </p>


                    </div>
                </div>

                <div class="mt-auto">
                    <button class="btn btn-dark w-100" (click)="addToCart(product)">
                        add to cart
                    </button>
                </div>

            </div>

        </div>

        }

    </div>

</div>
